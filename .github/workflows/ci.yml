name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            extra: ""
          - name: linux-clang-release
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
            extra: ""
          - name: linux-clang-asan-ubsan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            extra: "-DOB_SANITIZE=ON"
          - name: linux-gcc-debug-invariants
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Debug
            extra: "-DOB_ENABLE_INVARIANTS=ON"
          - name: linux-clang-tsan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            extra: "-DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"
          - name: macos-clang-release
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
            extra: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOB_WARNINGS_AS_ERRORS=ON
          -DOB_BUILD_BENCH=ON
          -DOB_BUILD_TOOLS=ON
          ${{ matrix.extra }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --timeout 900

  determinism:
    name: determinism across builds (E44)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      # Four builds differing in compiler, standard library and optimization level.
      # The event-stream fingerprint must be identical in all four, or the engine
      # depends on something it must not depend on. Verified locally across
      # Release and Debug before this workflow existed.
      - name: Build and fingerprint each configuration
        run: |
          set -euo pipefail
          : > fingerprints.txt
          for cfg in "gcc:g++:Release" "gcc:g++:Debug" "clang:clang++:Release" "clang:clang++:Debug"; do
            cc="${cfg%%:*}"; rest="${cfg#*:}"; cxx="${rest%%:*}"; bt="${rest#*:}"
            rm -rf "build-$cc-$bt"
            CC="$cc" CXX="$cxx" cmake -S . -B "build-$cc-$bt" -G Ninja \
              -DCMAKE_BUILD_TYPE="$bt" -DOB_WARNINGS_AS_ERRORS=ON
            cmake --build "build-$cc-$bt"
            "./build-$cc-$bt/tests/ob_tests" \
              --gtest_filter=Determinism.EventStreamFingerprintIsStable \
            | grep '^FINGERPRINT' | tee -a fingerprints.txt
          done
          cat fingerprints.txt

      - name: Assert every build agrees
        run: |
          set -euo pipefail
          distinct=$(sort -u fingerprints.txt | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::event stream is not deterministic across builds"
            sort -u fingerprints.txt
            exit 1
          fi
          echo "all four builds agree: $(head -1 fingerprints.txt)"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: |
          find include tests bench fuzz -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  differential:
    name: differential 10^7 operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOB_WARNINGS_AS_ERRORS=ON
          cmake --build build
      - name: Differential sweep
        # The seed base is derived from the commit, so coverage ACCUMULATES across
        # commits instead of re-running the same streams forever.
        env:
          OB_DIFF_OPS: 10000000
        run: |
          export OB_DIFF_SEED_BASE=$(( 0x$(git rev-parse --short=8 HEAD) ))
          echo "seed base $OB_DIFF_SEED_BASE"
          ./build/tests/ob_tests --gtest_filter='Differential.*'

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Build fuzz target
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOB_BUILD_FUZZ=ON -DOB_BUILD_TESTS=OFF
          cmake --build build-fuzz
      - name: Fuzz from the committed corpus
        # detect_leaks=0: libFuzzer's own runtime leaks ~56 bytes at exit on some
        # libcs. A fuzz target whose body is 'return 0;' reports the same leak.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./build-fuzz/fuzz/ob_fuzz_differential -max_total_time=300 fuzz/corpus_min
      - name: Upload any crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*

  perf-gate:
    name: instruction-count regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind
      - name: Assert valgrind is present
        # A skipped gate is worse than a missing one: it reports green forever.
        run: valgrind --version
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOB_BUILD_BENCH=ON -DOB_BUILD_TESTS=OFF
          cmake --build build
      - name: Check instruction counts against the baseline
        run: |
          python3 scripts/check_regression.py \
            --binary ./build/bench/ob_cachegrind_probe \
            --baseline bench/baselines/instructions.json
